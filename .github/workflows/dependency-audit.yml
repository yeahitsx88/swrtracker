name: Production dependency audit
on:
  pull_request:
  push:
    branches: [main, phase5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    container: node:22.23.3-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm exec tsx --test tests/identity/bcrypt-compatibility.test.ts