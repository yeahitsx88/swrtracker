name: Alpha 1 verification
on:
  pull_request:
  push:
    branches: [main, phase5, alpha1-audit-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    container: node:22.23.3-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm exec tsx --test tests/identity/bcrypt-compatibility.test.ts
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-fixture
          POSTGRES_DB: swr_team_isolated
        ports:
          - 15489:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:disposable-ci-fixture@127.0.0.1:15489/swr_team_isolated
      SWR_TEAM_POSTGRES: '1'
      JWT_SECRET: synthetic-ci-fixture-secret-only-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:postgres
      - run: pnpm build
